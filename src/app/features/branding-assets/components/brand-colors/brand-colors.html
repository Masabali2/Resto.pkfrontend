<div class="brand-colors">
  <div class="d-flex justify-content-between align-items-start align-items-sm-center gap-3 mb-4">
    <div>
      <h2 class="brand-section-title text-base font-black text-dark m-0">Brand Palette &amp; Preset Themes</h2>
      <p class="brand-section-subtitle text-xs text-muted m-0 mt-0.5">
        Colors automatically cascade into buttons, badges, and background tints across your live menu.
      </p>
    </div>
  </div>

  <!-- 1-Click Theme Presets -->
  <div class="row g-3 g-lg-4 mb-4">
    @for (preset of presets; track preset.name) {
      <div class="col-12 col-sm-6 col-lg-3">
        <button
          type="button"
          class="preset-card card-hover w-100 text-start bg-white border border-subtle rounded-3xl p-4 shadow-soft cursor-pointer smooth-transition position-relative overflow-hidden"
          (click)="applyPreset(preset)"
        >
          <div class="d-flex gap-2 mb-3">
            <span class="preset-swatch rounded-circle shadow-xs" [style.background]="preset.primary"></span>
            <span class="preset-swatch rounded-circle shadow-xs" [style.background]="preset.secondary"></span>
            <span class="preset-swatch rounded-circle border border-subtle" [style.background]="preset.tint"></span>
          </div>
          <div class="preset-name text-xs font-black text-dark mb-0.5">{{ preset.name }}</div>
          <div class="preset-hint text-10px text-muted">{{ presetHint(preset) }}</div>
        </button>
      </div>
    }
  </div>

  <!-- Custom Color Selection -->
  <div class="custom-colors-card bg-white border border-subtle rounded-3xl p-4 p-lg-5 shadow-soft">
    <div class="row g-4 align-items-end">
      @for (field of colorFields(); track field.key) {
        <div class="col-12 col-md-4">
          <label class="form-label text-xs font-bold text-dark d-block mb-2">{{ field.label }}</label>
          <div class="d-flex align-items-center gap-3">
            <input
              type="color"
              [value]="field.value"
              (input)="onColorPickerChange(field.key, $event)"
              class="color-picker-input flex-shrink-0 cursor-pointer border-0 rounded-2xl shadow-sm"
              style="width: 44px; height: 44px;"
            />
            <input
              type="text"
              [value]="field.value"
              (input)="onColorTextChange(field.key, $any($event.target).value)"
              class="form-control color-text-input px-3.5 py-2.5 rounded-xl text-xs font-mono font-bold text-uppercase bg-surface-soft border border-subtle"
              maxlength="7"
            />
          </div>
        </div>
      }
    </div>
  </div>
</div>
