<div class="hero-layout-settings">
  <div class="d-flex justify-content-between align-items-start align-items-sm-center gap-3 mb-4">
    <div>
      <h2 class="brand-section-title text-base font-black text-dark m-0">Public Hero Header Layout</h2>
      <p class="brand-section-subtitle text-xs text-muted m-0 mt-0.5">
        Choose how the header banner renders on the customer website homepage.
      </p>
    </div>
  </div>

  <div class="row g-4">
    @for (item of layouts; track item.value) {
      <div class="col-12 col-sm-4">
        <button
          type="button"
          class="hero-card card-hover w-100 text-start bg-white rounded-3xl p-4 p-lg-5 smooth-transition cursor-pointer"
          [class.hero-card--active]="isActive(item.value)"
          (click)="selectLayout(item.value)"
        >
          <!-- Wireframe illustration based on layout type -->
          <div class="wireframe-box rounded-2xl mb-4 overflow-hidden d-flex" style="height: 110px;">
            @if (item.value === 'split') {
              <div class="w-100 h-100 bg-surface-soft p-3 d-flex gap-2 border border-subtle rounded-2xl">
                <div class="w-50 bg-white rounded-xl p-2 d-flex flex-column justify-content-center border border-subtle">
                  <div class="rounded mb-1" style="width: 50%; height: 8px; background: #0f172a;"></div>
                  <div class="rounded" style="width: 75%; height: 5px; background: #cbd5e1;"></div>
                </div>
                <div class="w-50 rounded-xl" style="background: linear-gradient(135deg, #cbd5e1, #94a3b8);"></div>
              </div>
            }

            @if (item.value === 'overlay') {
              <div class="w-100 h-100 bg-dark p-3 d-flex align-items-end rounded-2xl position-relative overflow-hidden" style="background: linear-gradient(to top, #0f172a 80%, #334155);">
                <div>
                  <div class="rounded mb-1" style="width: 70px; height: 8px; background: #ffffff;"></div>
                  <div class="rounded" style="width: 45px; height: 5px; background: #94a3b8;"></div>
                </div>
              </div>
            }

            @if (item.value === 'compact') {
              <div class="w-100 h-100 bg-surface-soft p-3 d-flex flex-column align-items-center justify-content-center text-center border border-subtle rounded-2xl">
                <div class="rounded-circle mb-2" style="width: 28px; height: 28px; background: #f97316;"></div>
                <div class="rounded" style="width: 60px; height: 6px; background: #0f172a;"></div>
              </div>
            }
          </div>

          <!-- Bottom Label and Check indicator -->
          <div class="d-flex align-items-center justify-content-between">
            <span class="text-xs font-bold text-dark">{{ item.label }}</span>
            @if (isActive(item.value)) {
              <i class="bi bi-check-circle-fill text-orange" style="font-size: 1.15rem;"></i>
            } @else {
              <i class="bi bi-circle text-muted" style="font-size: 1.15rem;"></i>
            }
          </div>
        </button>
      </div>
    }
  </div>
</div>
