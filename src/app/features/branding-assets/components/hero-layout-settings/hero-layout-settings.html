<div class="hero-layout-settings">
  <div class="d-flex justify-between align-items-start align-items-sm-center gap-3 mb-4">
    <div>
      <h2 class="brand-section-title">Public Hero Header Layout</h2>
      <p class="brand-section-subtitle">
        Choose how the header banner renders on the customer website homepage.
      </p>
    </div>
  </div>

  <div class="row g-3">
    @for (layout of layouts; track layout.value) {
      <div class="col-12 col-sm-6 col-lg-3">
        <button type="button" class="{{ layoutClass(layout.value) }}" (click)="selectLayout(layout.value)">
          <div class="layout-preview h-32 rounded-xl mb-3 d-flex align-items-center justify-center overflow-hidden"
               [class.layout-preview-split]="layout.value === 'split'"
               [class.layout-preview-overlay]="layout.value === 'overlay'"
               [class.layout-preview-compact]="layout.value === 'compact'">
            <i class="bi {{ iconFor(layout.value) }} layout-preview-icon"></i>
          </div>
          <div class="d-flex justify-between align-items-center">
            <span class="layout-label text-xs font-bold text-dark">{{ layout.label }}</span>
            @if (isActive(layout.value)) {
              <i class="bi bi-check-circle-fill text-orange"></i>
            } @else {
              <i class="bi bi-circle text-muted"></i>
            }
          </div>
        </button>
      </div>
    }
  </div>
</div>
