<div class="branding-page d-flex flex-column w-100 gap-4" style="max-width: 1600px; margin: 0 auto;">
  <app-branding-header
    [restaurant]="restaurant()"
    [storage]="storage()"
    [storageLoading]="loading()"
    [dirty]="form.dirty"
    [saving]="saving()"
    (previewClicked)="openPreview()"
    (saveClicked)="saveAll()"
  />

  <div class="branding-content-card bg-white rounded-3xl border border-subtle shadow-soft overflow-hidden">
    <app-branding-tabs
      [activeTab]="activeTab()"
      (tabSelected)="switchTab($any($event))"
    />

    <main class="branding-main p-4 p-md-5">
      <!-- Section 1: Assets -->
      <section [hidden]="activeTab() !== 'assets'" class="branding-section animate-fade-in">
        <app-asset-management
          [assets]="assets()"
          [restaurant]="restaurant()?.id ?? null"
          [loading]="loading()"
          (assetsChange)="onAssetsChange($any($event))"
        />
      </section>

      <!-- Section 2: Colors -->
      <section [hidden]="activeTab() !== 'colors'" class="branding-section animate-fade-in">
        <app-brand-colors
          [theme]="theme()"
          (themeChange)="onThemeChange($any($event))"
        />
      </section>

      <!-- Section 3: Typography -->
      <section [hidden]="activeTab() !== 'typography'" class="branding-section animate-fade-in">
        <app-typography-settings
          [typography]="typography()"
          [theme]="theme()"
          (typographyChange)="onTypographyChange($any($event))"
        />
      </section>

      <!-- Section 4: Hero Layout -->
      <section [hidden]="activeTab() !== 'hero'" class="branding-section animate-fade-in">
        <app-hero-layout-settings
          [heroLayout]="heroLayout()"
          (heroLayoutChange)="onHeroLayoutChange($any($event))"
        />
      </section>

      <!-- Section 5: Media Library -->
      <section [hidden]="activeTab() !== 'library'" class="branding-section animate-fade-in">
        <app-media-library
          [assets]="assets()"
          [restaurant]="restaurant()?.id ?? null"
          [loading]="loading()"
          (assetsChange)="onAssetsChange($any($event))"
        />
      </section>
    </main>
  </div>

  <app-website-preview-modal
    [open]="previewOpen()"
    [restaurant]="{ id: restaurant()?.id ?? '', name: restaurant()?.name ?? '' }"
    [logoUrl]="logoAsset()?.previewUrl ?? ''"
    [heroBannerUrl]="heroBannerAsset()?.previewUrl ?? ''"
    [theme]="theme()"
    [typography]="typography()"
    [heroLayout]="heroLayout()"
    (close)="closePreview()"
  />
</div>
