<section class="progress-section" aria-label="Order progress">
  @if (isCancelled()) {
    <div class="cancelled-state" role="status">
      <i class="bi bi-x-circle" aria-hidden="true"></i>
      <div>
        <strong>Order cancelled</strong>
        <p>This order will not move through the remaining fulfilment steps.</p>
      </div>
    </div>
  } @else {
    <ol class="progress-steps">
      @for (step of steps; track step; let index = $index) {
        <li class="progress-step"
            [class.is-complete]="index < activeStep()"
            [class.is-current]="index === activeStep()"
            [attr.aria-current]="index === activeStep() ? 'step' : null">
          <span class="step-marker">
            @if (index < activeStep()) {
              <i class="bi bi-check" aria-hidden="true"></i>
            } @else {
              {{ index + 1 }}
            }
          </span>
          <span class="step-label">{{ step }}</span>
        </li>
      }
    </ol>
  }
</section>
