<app-public-order-frame step="confirmation">
  <main class="confirmation-page" aria-labelledby="confirmation-title">
    <section class="confirmation-card" role="status">
      <span class="confirmation-icon" aria-hidden="true"><i class="bi bi-receipt"></i></span>
      <p class="eyebrow">ORDER CONFIRMATION</p>
      <h1 id="confirmation-title">Your order confirmation will appear here</h1>
      <p>An order number and tracking link are shown only after the restaurant successfully accepts your checkout request.</p>
      <div class="security-note"><i class="bi bi-lock" aria-hidden="true"></i><span>Your private tracking link is issued once when an order is created. It is not stored in this page preview.</span></div>
      <a routerLink="../cart"><i class="bi bi-arrow-left" aria-hidden="true"></i> Return to cart</a>
    </section>
  </main>
</app-public-order-frame>
