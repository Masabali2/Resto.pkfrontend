<app-public-order-frame step="cart">
  <main class="page-content" aria-labelledby="cart-title">
    <header class="page-heading"><p class="eyebrow">YOUR ORDER</p><h1 id="cart-title">Your cart</h1><p>Review your items before moving to checkout.</p></header>
    <section class="empty-card" aria-labelledby="empty-cart-title">
      <span class="empty-icon" aria-hidden="true"><i class="bi bi-basket3"></i></span>
      <h2 id="empty-cart-title">Your cart is empty</h2>
      <p>Items you add from the restaurant menu will appear here. Review quantities and totals before checkout.</p>
      <span class="integration-note"><i class="bi bi-info-circle" aria-hidden="true"></i> Cart connection will be enabled during API integration.</span>
    </section>
  </main>
</app-public-order-frame>
