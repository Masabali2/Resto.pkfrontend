<footer class="footer">
  <div class="footer-inner">
    <div class="footer-brand">
      <span class="footer-logo">Resto<span class="brand-accent">.pk</span></span>
      <p class="footer-tagline">Restaurant website platform.</p>
    </div>

    <nav class="footer-columns" aria-label="Footer">
      @for (column of columns; track column.title) {
        <div class="footer-column">
          <h3 class="column-title">{{ column.title }}</h3>
          <ul>
            @for (link of column.links; track link.label) {
              <li>
                @if (link.route) {
                  <a [routerLink]="link.route">{{ link.label }}</a>
                } @else {
                  <a [href]="'#' + link.anchor">{{ link.label }}</a>
                }
              </li>
            }
          </ul>
        </div>
      }
    </nav>
  </div>

  <div class="footer-bottom">
    <small>&copy; {{ currentYear }} Resto.pk. All rights reserved.</small>
  </div>
</footer>
