<header class="navbar">
  <div class="navbar-inner">
    <a class="navbar-brand" routerLink="/" aria-label="Resto.pk home">
      <span class="brand-mark" aria-hidden="true">R</span>
      <span class="brand-word">Resto<span class="brand-accent">.pk</span></span>
    </a>

    <nav class="navbar-links" aria-label="Primary">
      @for (link of navLinks; track link.anchor) {
        <a class="navbar-link" [href]="'#' + link.anchor">{{ link.label }}</a>
      }
    </nav>

    <div class="navbar-actions">
      <a class="navbar-auth-link" routerLink="/login">Sign In</a>
      <a class="navbar-cta" routerLink="/register">
        <app-button variant="primary" size="sm" [fullWidth]="false">Get Started</app-button>
      </a>
    </div>

    <button
      type="button"
      class="mobile-menu-toggle"
      [attr.aria-expanded]="mobileMenuOpen()"
      [attr.aria-controls]="mobileMenuOpen() ? 'mobile-nav' : null"
      [attr.aria-label]="mobileMenuOpen() ? 'Close navigation menu' : 'Open navigation menu'"
      (click)="toggleMobileMenu()">
      <span class="visually-hidden">&#9776;</span>
      <span class="toggle-bar" [class.open]="mobileMenuOpen()" aria-hidden="true"></span>
    </button>
  </div>

  @if (mobileMenuOpen()) {
    <nav id="mobile-nav" class="mobile-nav" aria-label="Mobile">
      @for (link of navLinks; track link.anchor) {
        <a class="mobile-link" [href]="'#' + link.anchor" (click)="closeMobileMenu()">{{ link.label }}</a>
      }
      <div class="mobile-actions">
        <a class="mobile-auth-link" routerLink="/login" (click)="closeMobileMenu()">Sign In</a>
        <a routerLink="/register" (click)="closeMobileMenu()">
          <app-button variant="primary" size="md" [fullWidth]="true">Get Started</app-button>
        </a>
      </div>
    </nav>
  }
</header>
