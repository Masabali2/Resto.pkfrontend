
<div class="row g-3 g-lg-4 mb-4 summary-grid">
  @for (card of cards(); track card.label) {
    <div class="col-6 col-lg-3">
      <article
        class="summary-card card h-100"
        [attr.data-variant]="card.variant"
      >
        <div class="card-body summary-card__content">

          <div class="summary-card__top">
            <div class="summary-card__heading">
              <span class="summary-card__label">
                {{ card.label }}
              </span>

              <span class="summary-card__subtitle">
                {{ card.subtitle }}
              </span>
            </div>

            <div class="summary-card__icon">
              <i class="bi" [class]="card.icon" aria-hidden="true"></i>
            </div>
          </div>

          <div class="summary-card__bottom">
            <h3 class="summary-card__value">
              {{ card.value }}
            </h3>

            <span class="summary-card__indicator">
              <i class="bi bi-graph-up-arrow"></i>
              <span>Overview</span>
            </span>
          </div>

          <div class="summary-card__accent"></div>

        </div>
      </article>
    </div>
  }
</div>
