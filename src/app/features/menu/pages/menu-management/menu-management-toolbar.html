<div class="toolbar">
  <div class="toolbar__search">
    <span class="toolbar__search-icon" aria-hidden="true"><i class="bi bi-search"></i></span>
    <input
      type="text"
      class="toolbar__search-input"
      [value]="search()"
      (input)="onSearchInput($event)"
      placeholder="Search items by name…"
      aria-label="Search menu items"
    />
    @if (search()) {
      <button type="button" class="toolbar__search-clear" (click)="onClearSearch()" aria-label="Clear search">
        <i class="bi bi-x-lg"></i>
      </button>
    }
  </div>

  <div class="toolbar__filters">
    <div class="toolbar__filter">
      <label class="toolbar__filter-label">Category</label>
      <select
        class="toolbar__filter-select"
        [value]="selectedCategory()?.id ?? 'all'"
        (change)="onCategorySelect($any($event.target).value === 'all' ? null : $any($event.target).value)"
      >
        <option value="all">All categories</option>
        @for (cat of categories(); track cat.id) {
          <option [value]="cat.id">{{ cat.name }}</option>
        }
      </select>
    </div>

    <div class="toolbar__filter">
      <label class="toolbar__filter-label">Availability</label>
      <select
        class="toolbar__filter-select"
        [value]="availability()"
        (change)="onAvailabilitySelect($any($event.target).value)"
      >
        @for (opt of availabilityOptions; track opt.value) {
          <option [value]="opt.value">{{ opt.label }}</option>
        }
      </select>
    </div>
  </div>

  <div class="toolbar__actions">
    @if (activeFilterCount() > 0) {
      <button type="button" class="btn btn--outline btn--sm" (click)="onClearFilters()">
        Clear filters
      </button>
    }
    @if (canCreate() && !readOnly()) {
      <button type="button" class="btn btn--primary" (click)="onCreate()">
        <i class="bi bi-plus-lg" aria-hidden="true"></i> Add item
      </button>
    }
  </div>
</div>

@if (categories().length > 0) {
  <div class="chips">
    <button
      type="button"
      class="chip"
      [class.chip--active]="selectedCategory() === null"
      (click)="onCategorySelect(null)"
    >
      All categories
      <span class="chip__count">{{ totalItems() }}</span>
    </button>
    @for (cat of categories(); track cat.id) {
      <button
        type="button"
        class="chip"
        [class.chip--active]="selectedCategory()?.id === cat.id"
        (click)="onCategorySelect(cat.id)"
      >
        {{ cat.name }}
        <span class="chip__count">{{ cat.itemCount }}</span>
      </button>
    }
  </div>
}
