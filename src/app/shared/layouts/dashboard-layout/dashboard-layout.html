<div
  class="shell"
  [class.drawer-open]="drawerOpen()"
  [class.is-mobile]="isMobile()"
  (keydown)="onDrawerKeydown($event)"
>
  <a class="skip-link" href="#dashboard-main">Skip to main content</a>

  @if (isMobile() && drawerOpen()) {
    <div class="scrim" aria-hidden="true" (click)="closeDrawer()"></div>
  }

  <aside
    id="dashboard-nav"
    class="sidebar-area"
    tabindex="-1"
    [attr.aria-label]="isMobile() ? 'Dashboard navigation menu' : null"
    [attr.role]="isMobile() ? 'dialog' : null"
    [attr.aria-modal]="isMobile() && drawerOpen() ? 'true' : null"
  >
    @if (isMobile()) {
      <button
        type="button"
        class="sidebar-close"
        aria-label="Close navigation menu"
        (click)="closeDrawer()"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" aria-hidden="true">
          <path d="m6 6 12 12M18 6 6 18" />
        </svg>
      </button>
    }

    <app-dashboard-sidebar (navigateRequested)="closeDrawer()" />
  </aside>

  <div class="content-area">
    <app-dashboard-header (toggleSidebar)="toggleDrawer()" />

    <main id="dashboard-main" class="main" tabindex="-1">
      <router-outlet />
    </main>
  </div>
</div>
