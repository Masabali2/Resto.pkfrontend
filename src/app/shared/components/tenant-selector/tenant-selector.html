@if (visible()) {
  <div class="tenant-selector" (keydown)="onKeydown($event)">
    <button
      type="button"
      class="selector-trigger"
      aria-haspopup="listbox"
      [attr.aria-expanded]="open()"
      aria-label="Switch workspace"
      [disabled]="switching()"
      (click)="toggle()"
    >
      <span class="selector-dot" aria-hidden="true"></span>
      <span class="selector-label">{{ activeTenantLabel() }}</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m6 9 6 6 6-6" />
      </svg>
    </button>

    @if (open()) {
      <ul class="selector-menu" role="listbox" aria-label="Workspaces">
        @for (membership of memberships(); track membership.tenantId) {
          <li>
            <button
              type="button"
              role="option"
              [attr.aria-selected]="membership.tenantId === activeTenantId()"
              class="selector-option"
              [class.is-active]="membership.tenantId === activeTenantId()"
              (click)="switchTo(membership.tenantId)"
            >
              <span class="option-name">{{ membership.name }}</span>
              <span class="option-role">{{ membership.roleName }}</span>
            </button>
          </li>
        }
      </ul>
    }
  </div>
}
