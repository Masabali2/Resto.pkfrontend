<header class="header">
  <div class="header-left">
    <button
      type="button"
      class="icon-btn menu-toggle"
      aria-label="Open navigation menu"
      (click)="toggleSidebar.emit()"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" aria-hidden="true">
        <path d="M4 7h16M4 12h16M4 17h16" />
      </svg>
    </button>

    <nav class="breadcrumb" aria-label="Breadcrumb">
      <a class="crumb-root" routerLink="/dashboard">Dashboard</a>
      <span class="crumb-sep" aria-hidden="true">/</span>
      <span class="crumb-current" aria-current="page">Overview</span>
    </nav>
  </div>

  <div class="header-right">
    <div class="account" (keydown)="onAccountKeydown($event)">
      <button
        type="button"
        class="account-trigger"
        aria-haspopup="menu"
        [attr.aria-expanded]="accountOpen()"
        aria-label="Account menu"
        (click)="toggleAccount()"
      >
        <span class="avatar" aria-hidden="true">{{ initials() }}</span>
        <span class="account-name">{{ userName() }}</span>
        <svg class="chevron" [class.is-open]="accountOpen()" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <path d="m6 9 6 6 6-6" />
        </svg>
      </button>

      @if (accountOpen()) {
        <div class="backdrop" (click)="closeAccount()"></div>

        <div class="account-menu" role="menu" aria-label="Account">
          <div class="menu-identity">
            <span class="menu-name">{{ userName() }}</span>
            @if (userEmail()) {
              <span class="menu-email">{{ userEmail() }}</span>
            }
          </div>
          <div class="menu-divider" role="separator"></div>
          <a class="menu-item" role="menuitem" routerLink="/dashboard" (click)="closeAccount()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 13h6V4H4v9Zm0 7h6v-5H4v5Zm10 0h6v-9h-6v9Zm0-16v5h6V4h-6Z" />
            </svg>
            Dashboard overview
          </a>
          <button type="button" class="menu-item is-danger" role="menuitem" (click)="signOut()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H3" />
            </svg>
            Sign out
          </button>
        </div>
      }
    </div>
  </div>
</header>
