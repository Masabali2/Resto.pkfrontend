@if (open()) {
  <div class="confirmation-overlay" role="dialog" aria-modal="true" aria-labelledby="cd-title" aria-describedby="cd-message" (keydown)="onKeydown($event)">
    <div class="panel">
      <h2 id="cd-title">{{ title() }}</h2>
      <p id="cd-message">{{ message() }}</p>
      <div class="actions">
        <button type="button" #cancelButton class="btn btn-secondary" (click)="onCancel()">Cancel</button>
        <button type="button" #confirmButton class="btn btn-danger" (click)="onConfirm()">{{ confirmLabel() }}</button>
      </div>
    </div>
  </div>
}
