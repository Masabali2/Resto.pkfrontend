<header class="navbar">
  <div class="navbar-left">
    <button
      type="button"
      class="icon-btn menu-toggle"
      aria-label="Open navigation menu"
      (click)="toggleMenu()"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" aria-hidden="true">
        <path d="M4 7h16M4 12h16M4 17h16" />
      </svg>
    </button>

    <a class="brand brand-mobile" routerLink="/dashboard" aria-label="Resto.pk dashboard">
      <span class="brand-mark" aria-hidden="true">R</span>
      <span class="brand-word">Resto<span class="brand-accent">.pk</span></span>
    </a>

    @if (activeTenantName(); as tenantName) {
      <span class="tenant-divider" aria-hidden="true"></span>
      <span class="workspace" title="{{ tenantName }}">
        <span class="workspace-label">Workspace</span>
        <span class="workspace-name">{{ tenantName }}</span>
      </span>
    }
  </div>

  <div class="navbar-right">
    <app-restaurant-switcher />

    <div class="account" (keydown)="onAccountKeydown($event)">
      <button
        type="button"
        class="account-trigger"
        [disabled]="signingOut()"
        aria-haspopup="menu"
        [attr.aria-expanded]="accountOpen()"
        aria-label="Account menu"
        (click)="toggleAccount()"
      >
        <span class="avatar" aria-hidden="true">{{ initials() }}</span>
        <span class="account-name">{{ displayName() }}</span>
        <svg class="chevron" [class.is-open]="accountOpen()" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <path d="m6 9 6 6 6-6" />
        </svg>
      </button>

      @if (accountOpen()) {
        <div class="backdrop" (click)="closeAccount()"></div>

        <div class="account-menu" role="menu" aria-label="Account">
          <div class="menu-identity">
            <span class="menu-name">{{ displayName() }}</span>
            @if (userEmail()) {
              <span class="menu-email">{{ userEmail() }}</span>
            }
            @if (primaryRole()) {
              <span class="menu-role">{{ primaryRole() }}</span>
            }
          </div>
          <div class="menu-divider" role="separator"></div>
          <button
            type="button"
            class="menu-item is-danger"
            role="menuitem"
            [disabled]="signingOut()"
            (click)="signOut()"
          >
            @if (signingOut()) {
              <span class="spinner" aria-hidden="true"></span>
            } @else {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H3" />
              </svg>
            }
            {{ signingOut() ? 'Signing out…' : 'Sign out' }}
          </button>
        </div>
      }
    </div>
  </div>
</header>
